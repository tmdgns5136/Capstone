jwt:
  secret: vmfhaltjskqwqpwoeirutyalskdjfhgzmxncbv1234567890

spring:
  application:
    name: demo

  servlet:
    multipart:
      enabled: true
      max-file-size: 30MB
      max-request-size: 60MB

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/attendance_db?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

com:
  example:
    upload:
      path:
        profileImg: ${UPLOAD_PATH:./uploads}

device:
  upload:
    path: ${DEVICE_UPLOAD_PATH:./uploads/device-attendance}
  default-timezone: ${DEVICE_DEFAULT_TIMEZONE:Asia/Seoul}
  mqtt:
    broker-url: ${DEVICE_MQTT_BROKER_URL:tcp://100.68.215.22:1883}
    username: ${DEVICE_MQTT_USERNAME:}
    password: ${DEVICE_MQTT_PASSWORD:}
    tls-enabled: ${DEVICE_MQTT_TLS_ENABLED:false}
    qos: ${DEVICE_MQTT_QOS:1}

mqtt:
  broker-url: ${MQTT_BROKER_URL:tcp://localhost:1883}
  client-id: ${MQTT_CLIENT_ID:capstone-server}
  username: ${MQTT_USERNAME:}
  password: ${MQTT_PASSWORD:}

aws:
  rekognition:
    region: ${AWS_REKOGNITION_REGION:ap-northeast-2}
    similarity-threshold: ${AWS_REKOGNITION_SIMILARITY_THRESHOLD:50}

stream:
  yolo:
    worker:
      enabled: ${YOLO_WORKER_ENABLED:false}
      command: ${YOLO_WORKER_COMMAND:python}
      script: ${YOLO_WORKER_SCRIPT:yolo_stream_worker.py}
      directory: ${YOLO_WORKER_DIRECTORY:C:/Users/yohan/Desktop/yolo-stream}